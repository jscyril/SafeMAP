<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="2100" height="1120" viewBox="0 0 2100 1120"
     role="img" aria-labelledby="title description">
  <title id="title">SafeMAP conversion and acceptance pipeline</title>
  <desc id="description">
    A two-lane flowchart. The main SafeMAP lane ingests and analyzes C,
    screens for safety eligibility, creates an auditable migration plan,
    checks for implemented synthesis support, and synthesizes safe Rust.
    A separate C2Rust baseline lane produces reference Rust. Both outputs
    face the same strict safety and validation policy. Every accepted,
    rejected, and unsupported outcome is recorded in an artifact report.
  </desc>

  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfdff"/>
      <stop offset="1" stop-color="#f5f8fb"/>
    </linearGradient>
    <linearGradient id="analysisFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8f1f8"/>
      <stop offset="1" stop-color="#f5f9fc"/>
    </linearGradient>
    <linearGradient id="planFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e5f5f5"/>
      <stop offset="1" stop-color="#f4fbfb"/>
    </linearGradient>
    <linearGradient id="gateFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5d9"/>
      <stop offset="1" stop-color="#fffaf0"/>
    </linearGradient>
    <linearGradient id="policyFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf1fa"/>
      <stop offset="1" stop-color="#f8f9fd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7"
                    flood-color="#17324d" flood-opacity="0.13"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#40566b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#176b87"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b55243"/>
    </marker>
    <style>
      .sans { font-family: "DejaVu Sans", "Liberation Sans", Arial, sans-serif; }
      .lane-title { font-size: 24px; font-weight: 700; letter-spacing: 1.5px; }
      .step { font-size: 21px; font-weight: 700; letter-spacing: 1px; }
      .box-title { font-size: 29px; font-weight: 700; fill: #17324d; }
      .body { font-size: 24px; fill: #40566b; }
      .small { font-size: 21px; fill: #52677b; }
      .tiny { font-size: 19px; fill: #617386; }
      .chip { font-size: 18px; font-weight: 700; letter-spacing: .4px; }
      .arrow { fill: none; stroke: #40566b; stroke-width: 5; marker-end: url(#arrow); }
      .arrow-blue { fill: none; stroke: #176b87; stroke-width: 6; marker-end: url(#arrowBlue); }
      .arrow-red { fill: none; stroke: #b55243; stroke-width: 4; marker-end: url(#arrowRed); }
      .dash { stroke-dasharray: 12 10; }
    </style>
  </defs>

  <rect width="2100" height="1120" fill="url(#canvas)"/>

  <!-- Lane labels -->
  <rect x="42" y="38" width="2016" height="48" rx="24" fill="#eaf2f8"/>
  <circle cx="72" cy="62" r="9" fill="#176b87"/>
  <text x="94" y="70" class="sans lane-title" fill="#17324d">SAFEMAP SAFE-FIRST LANE</text>
  <text x="2020" y="69" text-anchor="end" class="sans small" fill="#52677b">
    Analysis guides generation; failed decisions remain visible
  </text>

  <!-- Main pipeline connectors, drawn behind boxes -->
  <path d="M 284 230 L 313 230" class="arrow"/>
  <path d="M 657 230 L 713 230" class="arrow"/>
  <path d="M 953 230 L 1008 230" class="arrow"/>
  <path d="M 1298 230 L 1353 230" class="arrow"/>
  <path d="M 1583 230 L 1638 230" class="arrow-blue"/>

  <!-- Input -->
  <g filter="url(#shadow)">
    <rect x="42" y="128" width="242" height="220" rx="18"
          fill="#ffffff" stroke="#7d91a3" stroke-width="3"/>
    <rect x="42" y="128" width="242" height="47" rx="18" fill="#17324d"/>
    <path d="M 42 158 L 42 175 L 284 175 L 284 158" fill="#17324d"/>
  </g>
  <text x="64" y="160" class="sans step" fill="#ffffff">INPUT</text>
  <g transform="translate(62 205) scale(.72)">
    <path d="M 0 0 H 69 L 94 25 V 97 H 0 Z" fill="#f4f7fa"
          stroke="#176b87" stroke-width="3"/>
    <path d="M 69 0 V 25 H 94" fill="none" stroke="#176b87" stroke-width="3"/>
    <text x="47" y="62" text-anchor="middle" class="sans box-title" fill="#176b87">.c</text>
  </g>
  <text x="142" y="225" class="sans box-title">C project</text>
  <text x="142" y="256" class="sans small">sources</text>
  <text x="142" y="283" class="sans small">headers</text>
  <text x="142" y="310" class="sans small">build info</text>

  <!-- Analysis -->
  <g filter="url(#shadow)">
    <rect x="313" y="108" width="344" height="260" rx="18"
          fill="url(#analysisFill)" stroke="#477998" stroke-width="3"/>
  </g>
  <text x="337" y="143" class="sans step" fill="#176b87">1 · ANALYZE</text>
  <text x="337" y="183" class="sans box-title">Recover structure</text>
  <line x1="337" y1="199" x2="632" y2="199" stroke="#b9cbd8" stroke-width="2"/>
  <circle cx="349" cy="228" r="5" fill="#176b87"/>
  <text x="366" y="235" class="sans body">ingest + build recovery</text>
  <circle cx="349" cy="264" r="5" fill="#176b87"/>
  <text x="366" y="271" class="sans body">functions + dependencies</text>
  <circle cx="349" cy="300" r="5" fill="#176b87"/>
  <text x="366" y="307" class="sans body">pointer roles + C idioms</text>
  <circle cx="349" cy="336" r="5" fill="#176b87"/>
  <text x="366" y="343" class="sans body">unsupported constructs</text>

  <!-- Eligibility gate -->
  <g filter="url(#shadow)">
    <rect x="713" y="108" width="240" height="260" rx="18"
          fill="url(#gateFill)" stroke="#b8871e" stroke-width="3"/>
  </g>
  <text x="737" y="143" class="sans step" fill="#936b14">DECISION 1</text>
  <text x="737" y="183" class="sans box-title">Safety screen</text>
  <text x="737" y="222" class="sans body">Can this unit be</text>
  <text x="737" y="251" class="sans body">expressed safely</text>
  <text x="737" y="280" class="sans body">in principle?</text>
  <rect x="737" y="300" width="122" height="30" rx="15" fill="#dcefeb"/>
  <text x="798" y="321" text-anchor="middle" class="sans chip" fill="#176b60">ELIGIBLE</text>

  <!-- Migration plan -->
  <g filter="url(#shadow)">
    <rect x="1008" y="108" width="290" height="260" rx="18"
          fill="url(#planFill)" stroke="#318b86" stroke-width="3"/>
  </g>
  <text x="1032" y="143" class="sans step" fill="#176b60">2 · PLAN</text>
  <text x="1032" y="183" class="sans box-title">Migration plan</text>
  <line x1="1032" y1="199" x2="1274" y2="199" stroke="#b6d6d3" stroke-width="2"/>
  <text x="1032" y="232" class="sans body">safe Rust signature</text>
  <text x="1032" y="266" class="sans body">ownership + API shifts</text>
  <text x="1032" y="300" class="sans body">idiom transformations</text>
  <text x="1032" y="334" class="sans body">validation obligations</text>

  <!-- Synthesis support gate -->
  <g filter="url(#shadow)">
    <rect x="1353" y="108" width="230" height="260" rx="18"
          fill="url(#gateFill)" stroke="#b8871e" stroke-width="3"/>
  </g>
  <text x="1377" y="143" class="sans step" fill="#936b14">DECISION 2</text>
  <text x="1377" y="183" class="sans box-title">Implemented?</text>
  <text x="1377" y="222" class="sans body">Does the current</text>
  <text x="1377" y="251" class="sans body">generator support</text>
  <text x="1377" y="280" class="sans body">this pattern?</text>
  <rect x="1377" y="300" width="128" height="30" rx="15" fill="#dcefeb"/>
  <text x="1441" y="321" text-anchor="middle" class="sans chip" fill="#176b60">SUPPORTED</text>

  <!-- Safe synthesis -->
  <g filter="url(#shadow)">
    <rect x="1638" y="108" width="420" height="260" rx="18"
          fill="#e9f5f8" stroke="#176b87" stroke-width="4"/>
  </g>
  <text x="1662" y="143" class="sans step" fill="#176b87">GENERATE</text>
  <text x="1662" y="183" class="sans box-title">Deterministic safe synthesis</text>
  <line x1="1662" y1="199" x2="2034" y2="199" stroke="#b7d6df" stroke-width="2"/>
  <text x="1662" y="235" class="sans body">Rust-native types and APIs</text>
  <text x="1662" y="269" class="sans body">No C2Rust dependency</text>
  <rect x="1662" y="294" width="318" height="36" rx="8" fill="#17324d"/>
  <text x="1821" y="319" text-anchor="middle" class="sans chip" fill="#ffffff">
    #![forbid(unsafe_code)]
  </text>

  <!-- Rejection branch 1 -->
  <path d="M 833 368 L 833 424 L 594 424 L 594 466" class="arrow-red"/>
  <text x="849" y="406" class="sans chip" fill="#b55243">NO</text>
  <g filter="url(#shadow)">
    <rect x="401" y="466" width="386" height="132" rx="16"
          fill="#fff3f0" stroke="#b55243" stroke-width="3"/>
  </g>
  <text x="426" y="502" class="sans step" fill="#9c4135">EXPLICIT REJECTION</text>
  <text x="426" y="538" class="sans body">unsupported · unsafe required</text>
  <text x="426" y="569" class="sans body">manual refactor / aliasing risk</text>

  <!-- Rejection branch 2 -->
  <path d="M 1468 368 L 1468 424 L 1133 424 L 1133 466" class="arrow-red"/>
  <text x="1484" y="406" class="sans chip" fill="#b55243">NO</text>
  <g filter="url(#shadow)">
    <rect x="894" y="466" width="478" height="132" rx="16"
          fill="#fff3f0" stroke="#b55243" stroke-width="3"/>
  </g>
  <text x="919" y="502" class="sans step" fill="#9c4135">VISIBLE COVERAGE GAP</text>
  <text x="919" y="538" class="sans body">analyzer-eligible, but no matching</text>
  <text x="919" y="569" class="sans body">deterministic synthesis pattern</text>

  <!-- Safe synthesis to policy -->
  <path d="M 1848 368 L 1848 501" class="arrow-blue"/>
  <text x="1865" y="426" class="sans chip" fill="#176b60">SAFE RUST CANDIDATE</text>

  <!-- Baseline lane -->
  <rect x="42" y="622" width="1085" height="48" rx="24" fill="#f1eef7"/>
  <circle cx="72" cy="646" r="9" fill="#6b5b95"/>
  <text x="94" y="654" class="sans lane-title" fill="#3f365d">C2RUST BASELINE / REFERENCE LANE</text>

  <!-- input fork to baseline -->
  <path d="M 149 348 L 149 747 L 314 747" class="arrow dash"/>
  <g filter="url(#shadow)">
    <rect x="314" y="697" width="470" height="170" rx="18"
          fill="#f5f3f9" stroke="#6b5b95" stroke-width="3"/>
  </g>
  <text x="340" y="736" class="sans step" fill="#6b5b95">SEPARATE COMPARISON</text>
  <text x="340" y="778" class="sans box-title">C2Rust translation</text>
  <text x="340" y="813" class="sans body">behavior-preserving reference Rust</text>
  <text x="340" y="839" class="sans tiny">often retains raw pointers and unsafe operations</text>

  <path d="M 784 772 L 1433 772" class="arrow dash"/>
  <text x="1049" y="755" text-anchor="middle" class="sans chip" fill="#6b5b95">
    BASELINE RUST
  </text>

  <!-- Policy gate -->
  <g filter="url(#shadow)">
    <rect x="1433" y="501" width="625" height="366" rx="20"
          fill="url(#policyFill)" stroke="#384d78" stroke-width="4"/>
  </g>
  <rect x="1433" y="501" width="625" height="58" rx="20" fill="#384d78"/>
  <path d="M 1433 539 L 1433 559 L 2058 559 L 2058 539" fill="#384d78"/>
  <text x="1461" y="539" class="sans step" fill="#ffffff">3 · STRICT POLICY + VALIDATION</text>

  <text x="1461" y="598" class="sans body" font-weight="700" fill="#17324d">
    Required for policy acceptance
  </text>
  <circle cx="1471" cy="633" r="10" fill="#318b86"/>
  <path d="M 1466 633 l 4 5 l 8 -11" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="1491" y="640" class="sans small">Cargo check under forbid(unsafe_code)</text>
  <circle cx="1471" cy="672" r="10" fill="#318b86"/>
  <path d="M 1466 672 l 4 5 l 8 -11" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="1491" y="679" class="sans small">no unsafe / extern C constructs</text>
  <circle cx="1471" cy="711" r="10" fill="#318b86"/>
  <path d="M 1466 711 l 4 5 l 8 -11" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="1491" y="718" class="sans small">no public raw-pointer API</text>
  <circle cx="1471" cy="750" r="10" fill="#318b86"/>
  <path d="M 1466 750 l 4 5 l 8 -11" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="1491" y="757" class="sans small">planned unit present; tests acceptable</text>
  <circle cx="1471" cy="789" r="10" fill="#318b86"/>
  <path d="M 1466 789 l 4 5 l 8 -11" fill="none" stroke="#fff" stroke-width="3"/>
  <text x="1491" y="796" class="sans small">differential result acceptable when applicable</text>
  <text x="1461" y="827" class="sans tiny">
    Also recorded: Clippy · residual unsafe metrics · optional Miri
  </text>

  <!-- Policy outcomes -->
  <path d="M 2058 606 L 2078 606 L 2078 930 L 1990 930" class="arrow-blue"/>
  <rect x="1880" y="890" width="110" height="78" rx="14"
        fill="#e2f3e9" stroke="#27734c" stroke-width="3"/>
  <text x="1935" y="919" text-anchor="middle" class="sans chip" fill="#27734c">PASS</text>
  <text x="1935" y="950" text-anchor="middle" class="sans step" fill="#17324d">ACCEPT</text>

  <path d="M 1433 612 L 1402 612 L 1402 930 L 1510 930" class="arrow-red"/>
  <rect x="1510" y="890" width="222" height="78" rx="14"
        fill="#fff3f0" stroke="#b55243" stroke-width="3"/>
  <text x="1621" y="919" text-anchor="middle" class="sans chip" fill="#9c4135">ANY CHECK FAILS</text>
  <text x="1621" y="950" text-anchor="middle" class="sans step" fill="#17324d">REJECT</text>

  <!-- Unified reporting band -->
  <path d="M 1621 968 L 1621 1012" fill="none" stroke="#7d91a3"
        stroke-width="3" stroke-dasharray="8 8"/>
  <path d="M 1935 968 L 1935 1012" fill="none" stroke="#7d91a3"
        stroke-width="3" stroke-dasharray="8 8"/>
  <rect x="42" y="1012" width="2016" height="76" rx="18" fill="#17324d"/>
  <text x="78" y="1059" class="sans step" fill="#ffffff">EVERY OUTCOME IS AUDITABLE</text>
  <text x="476" y="1059" class="sans" font-size="21" fill="#d8e5ee">
    plans + reasons · generated artifacts · validation statuses · unsafe/raw-pointer metrics · research reports
  </text>
</svg>
