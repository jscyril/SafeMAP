# v3 development config: the v2 evaluation settings with amendment 3
# (per-unit Clippy) on by default. Development data only: the v2 held-out
# libraries are v3 development data; v3 needs a new sealed held-out corpus.
project:
  name: v3-development
  input: external_corpus/conference_heldout/projects

translation:
  mode: safemap_guided
  engine: unit
  prompt_guidance: true
  use_c2rust: false
  use_llm: true
  use_static_guidance: true
  use_pointer_roles: true
  use_safe_signatures: true
  use_dependency_grouping: true
  use_idiom_plans: true
  use_validation_feedback: true
  forbid_unsafe: true
  allow_c2rust_fallback_as_success: false
  max_units: null
  max_repair_attempts: 3
  direct_llm_max_c_loc: 5000
  automatic_confidence_threshold: 0.75

eligibility:
  reject_unknown_pointers: true
  reject_unresolved_aliasing: true
  reject_unions: true
  reject_function_pointers: true
  reject_inline_asm: true

llm:
  provider: openai_compatible
  model: gemini-3.5-flash-lite
  base_url: https://generativelanguage.googleapis.com/v1beta/openai/
  temperature: 0.0
  max_tokens: 8192
  timeout_seconds: 180
  api_key_env: GEMINI_API_KEY
  # When a provider's daily quota is used up, continue with the next one.
  # Every unit records the model that produced it (synthesis/summary.json).
  fallbacks:
    - model: nvidia/nemotron-3-ultra-550b-a55b:free
      base_url: https://openrouter.ai/api/v1
      api_key_env: OPENROUTER_API_KEY
    - model: openai/gpt-oss-120b
      base_url: https://api.groq.com/openai/v1
      api_key_env: GROQ_API_KEY

validation:
  run_cargo_check: true
  run_tests: true
  run_clippy: true
  run_miri: false
  run_differential_tests: true
  per_unit_clippy: true
  run_c_sanitizers: true
  differential_test_inputs: 1000
  seed: 20260728
  timeout_seconds: 180

repair:
  enabled: true
  max_iterations: 3
  forbid_unsafe: true

metrics:
  count_unsafe: true
  count_raw_pointers: true
  count_clippy_warnings: true

reporting:
  write_markdown: true
  write_json: true
  write_csv: true
